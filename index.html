<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>2025秋期末考试</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#f5f6fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#app{max-width:430px;margin:0 auto;background:#f5f6fa;min-height:100vh;position:relative}
/* 顶部 */
.header{background:#5a78d6;color:#fff;height:56px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.header span{outline:none}
/* 倒计时 */
.timer{background:#ffecec;color:#e35b5b;text-align:center;font-size:14px;padding:8px 0}
/* 内容 */
.content{padding:16px;padding-bottom:90px}
.section{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.section-title{color:#666;font-size:14px;margin-bottom:10px}
.question{font-size:15px;line-height:1.6;margin-bottom:6px}
.score{font-size:13px;color:#999;margin-bottom:10px}
.option{display:flex;align-items:flex-start;border:1px solid #eee;border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.option input{margin-top:3px;margin-right:10px}
textarea{width:100%;min-height:120px;border:1px solid #eee;border-radius:10px;padding:10px;font-size:14px}
/* 底部 */
.footer{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#fff;border-top:1px solid #eee;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.footer .progress{color:#4caf50;font-size:14px;cursor:pointer}
.footer .next{background:#5a78d6;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:14px}
/* 编辑模式 */
.editable{outline:2px dashed #5a78d6}
</style>
</head>
<body>
<div id="app">
  <div class="header"><span id="title" contenteditable="false">2024秋平时测试四</span></div>
  <div class="timer">剩余时间：<span id="time">120分60秒</span></div>

  <div class="content" id="content"></div>

  <div class="footer">
    <div class="progress" id="progress">0/10</div>
    <button class="next" id="nextBtn">下一题</button>
  </div>
</div>

<script>
/******** 数据 ********/
const questions = [
// 单选 10
{type:'single',score:1,title:'实践的主体是（ ）',opts:['绝对精神','具有思维能力、从事社会实践和认识活动的人','人','人的意识']},
{type:'single',score:1,title:'实践的客体是（ ）',opts:['绝对精神的对象化','客观物质世界','人的意识的创造物','进入主体的认识和实践范围的客观事物']},
{type:'single',score:1,title:'马克思主义认为，主客体之间的价值关系是指（ ）',opts:['主体对客体的物质欲望和要求','主体对客体的能动反映','主体对客体的改造和变革的结果','客体对于主体的有用性和效益性']},
{type:'single',score:1,title:'“社会上一旦有技术上的需要，则这种需要会比十所大学更能把科学推向前进。”这说明（ ）',opts:['实践是认识的来源','技术推动了科学的发展','实践是认识发展的动力','科学进步是实践的目的']},
{type:'single',score:1,title:'在商品经济运行中，价值、价格、供求三者之间的关系是（ ）',opts:['价格受供求关系影响，围绕价值上下波动','价格受价值影响，随供求关系变化而变动','价格由价值决定，反映价值并反映供求关系','价格由价值决定，反映价值但不反映供求关系']},
{type:'single',score:1,title:'生产商品的劳动二重性中，形成商品价值的是（ ）',opts:['个别劳动','社会劳动','具体劳动','抽象劳动']},
{type:'single',score:1,title:'货币最基本的职能是（ ）',opts:['价值尺度','流通手段','支付手段','贮藏手段和世界货币']},
{type:'single',score:1,title:'最鲜明体现资本主义国家实质的国家职能是（ ）',opts:['政治职能','经济职能','社会职能','对外交往职能']},
{type:'single',score:1,title:'商品经济的基本规律是（ ）',opts:['价值规律','剩余价值规律','竞争规律','货币流通规律']},
{type:'single',score:1,title:'检验认识真理性的唯一标准是（ ）',opts:['客观实际','科学理论','实践','逻辑证明']},
// 多选 3
{type:'multi',score:2,title:'下列选项中属于共产主义含义的有（ ）',opts:['一种科学理论','一种现实运动','一种社会制度','一种社会理想']},
{type:'multi',score:2,title:'价值是商品的本质属性，它是（ ）',opts:['凝结在商品中的抽象劳动','商品的社会属性','交换价值的基础','反映商品生产者之间的社会关系']},
{type:'multi',score:2,title:'生产商品的劳动二重性是指（ ）',opts:['个别劳动','社会劳动','具体劳动','抽象劳动']},
// 论述 1
{type:'essay',score:20,title:'为什么说社会主义是人类社会发展的必然？并分析阿尔温·古尔德纳的观点。'}
];

/******** 渲染 ********/
let index=0;
const content=document.getElementById('content');
const progress=document.getElementById('progress');
function render(){
 const q=questions[index];
 progress.innerText=(index+1)+'/'+questions.length;
 let html=`<div class=section>`;
 html+=`<div class=section-title>${q.type==='single'?'单项选择题':'多项选择题'}^</div>`;
 html+=`<div class=question>${index+1}. ${q.title}</div>`;
 html+=`<div class=score>（${q.score}分）</div>`;
 if(q.type==='essay'){
 html+=`<textarea placeholder="请输入答案"></textarea>`;
 }else{
 q.opts.forEach((o,i)=>{
 html+=`<label class=option><input type=${q.type==='single'?'radio':'checkbox'} name=q${index}>${String.fromCharCode(65+i)}. ${o}</label>`;
 });}
 html+='</div>';
 content.innerHTML=html;
}
render();

/******** 翻页 ********/
document.getElementById('nextBtn').onclick=()=>{if(index<questions.length-1){index++;render();content.scrollTop=0;}};
progress.onclick=()=>{if(index>0){index--;render();content.scrollTop=0;}};

/******** 倒计时 ********/
let total=120*60+60; // 按你要求 120分60秒
setInterval(()=>{
 total--;
 if(total<0)return;
 const m=Math.floor(total/60);
 const s=total%60;
 document.getElementById('time').innerText=`${m}分${s}秒`;
},1000);

/******** 交卷编辑 ********/
let editable=false;
document.querySelector('.header').onclick=()=>{
 editable=!editable;
 document.getElementById('title').contentEditable=editable;
 alert(editable?'进入编辑模式':'退出编辑模式');
};
</script>
</body>
</html>
